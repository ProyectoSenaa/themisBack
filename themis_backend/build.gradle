// Plugins
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

// Proyecto
group = 'co.sena.edu'
version = '0.0.1-SNAPSHOT'

// Java
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Configuraciones
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Repositorios
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// Variables de versión
ext {
    set('netflixDgsVersion', "10.1.2")
    set('grpcVersion', '1.58.0')
    set('protobufVersion', '3.24.0')
    set('grpcSpringBootVersion', '2.15.0.RELEASE')
}

// Dependencias
dependencies {

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework:spring-messaging'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Spring Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // GraphQL
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter'
    // The DGS subscriptions/websocket modules are optional and were previously commented out because those
    // artifacts aren't available in the configured repositories for the chosen DGS version. If you want
    // to enable GraphQL websocket subscriptions, uncomment and ensure the artifact/version is available.
    // implementation "com.netflix.graphql.dgs:graphql-dgs-subscriptions-websockets-autoconfigure:${netflixDgsVersion}"
    // implementation "com.netflix.graphql.dgs:graphql-dgs-subscriptions:${netflixDgsVersion}"
    implementation 'com.graphql-java:graphql-java-extended-scalars:21.0'

    // Apache Commons & POI
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // PDF
    implementation 'com.github.librepdf:openpdf:1.3.30'

    // JSON & Logging
    implementation group: 'org.json', name: 'json', version: '20250107'
    implementation group: 'log4j', name: 'log4j', version: '1.2.17'

    // HTML parsing
    implementation 'org.jsoup:jsoup:1.17.2'

    // ModelMapper
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.0'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Lombok


    // PostgreSQL
    // Ensure the Postgres JDBC driver is on the runtime classpath when running from IDE/bootRun
    // and also available at compile/run time for Spring Boot autoconfiguration.
    implementation 'org.postgresql:postgresql'

    // gRPC & Protobuf
    implementation "net.devh:grpc-server-spring-boot-starter:${grpcSpringBootVersion}"
    implementation "net.devh:grpc-client-spring-boot-starter:${grpcSpringBootVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.postgresql:postgresql'
}

// Gestión de dependencias
dependencyManagement {
    imports {
        mavenBom "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:${netflixDgsVersion}"
    }
}

// Configuración de Protobuf y gRPC
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Directorios fuente
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

// Tareas
tasks.named('test') {
    useJUnitPlatform()
}

clean {
    delete protobuf.generatedFilesBaseDir
}

compileJava {
    dependsOn 'generateProto'
}