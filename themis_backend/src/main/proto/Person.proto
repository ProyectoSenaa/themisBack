syntax = "proto3";

option java_multiple_files = true;
option java_package = "co.sena.edu.olympo_back.proto";
option java_outer_classname = "PersonProto";

service PersonService {
  rpc getPersonByDocument (PersonRequest) returns (PersonResponse);
  rpc getPersonById (PersonIdRequest) returns (PersonResponse);
}
message PersonRequest {
  int64 document = 1;
}
message PersonIdRequest {
  int64 person_id = 1;
}
message PersonResponse{
  int64 person_id = 1;
  int64 document = 2;
  string name = 3;
  string lastname = 4;
  string date_birth = 5;
  string blood_type = 6;
  string email = 7;
  string phone = 8;
  string address = 9;
  DocumentType document_type = 10;
  bool found = 11;
}
message DocumentType {
  int32 id = 1;
  string name = 2;
}